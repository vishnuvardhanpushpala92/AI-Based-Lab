
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management System</title>

    <!-- CSS STYLING -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #1e40af;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000010;
        }

        .card h3 {
            color: #64748b;
            margin-bottom: 12px;
        }

        .card h2 {
            color: #2563eb;
        }

        .form-section,
        .table-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px #00000010;
        }

        h2 {
            margin-bottom: 20px;
        }

        form input,
        form select {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            margin: 3px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel {
            background: #64748b;
        }

        .edit-btn {
            background: #16a34a;
        }

        .delete-btn {
            background: #dc2626;
        }

        #search {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #dbeafe;
            color: #1e40af;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #1e293b;
            color: white;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🏦 Bank Management System</h1>
        <p>Customer Account Management Dashboard</p>
    </header>

    <div class="container">

        <!-- DASHBOARD STATISTICS -->
        <section class="stats">

            <div class="card">
                <h3>Total Accounts</h3>
                <h2 id="totalAccounts">0</h2>
            </div>

            <div class="card">
                <h3>Total Sample Balance</h3>
                <h2 id="totalBalance">₹0</h2>
            </div>

        </section>

        <!-- ACCOUNT FORM -->
        <section class="form-section">

            <h2 id="formTitle">Create Bank Account</h2>

            <form id="accountForm">

                <input type="text" id="accountNumber"
                    placeholder="Account Number" required>

                <input type="text" id="customerName"
                    placeholder="Customer Name" required>

                <input type="email" id="email"
                    placeholder="Email Address" required>

                <input type="tel" id="phone"
                    placeholder="Phone Number"
                    pattern="[0-9]{10}" required>

                <select id="accountType" required>
                    <option value="">Select Account Type</option>
                    <option value="Savings">Savings</option>
                    <option value="Current">Current</option>
                </select>

                <input type="number" id="balance"
                    placeholder="Sample Account Balance"
                    min="0" step="0.01" required>

                <button type="submit" id="submitBtn">
                    Add Account
                </button>

                <button type="button" id="cancelBtn"
                    class="cancel" hidden>
                    Cancel
                </button>

            </form>
        </section>

        <!-- CUSTOMER TABLE -->
        <section class="table-section">

            <h2>Customer Account Details</h2>

            <input type="text" id="search"
                placeholder="Search by customer name or account number">

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Account No.</th>
                            <th>Customer Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Account Type</th>
                            <th>Balance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="accountTable"></tbody>

                </table>

            </div>
        </section>

    </div>

    <footer>
        <p>Bank Management System | AI-Based Software Lab Experiment 5</p>
    </footer>


    <!-- JAVASCRIPT FUNCTIONALITY -->
    <script>

        const accountForm = document.getElementById("accountForm");
        const accountTable = document.getElementById("accountTable");

        const totalAccounts = document.getElementById("totalAccounts");
        const totalBalance = document.getElementById("totalBalance");

        const searchInput = document.getElementById("search");
        const formTitle = document.getElementById("formTitle");
        const submitBtn = document.getElementById("submitBtn");
        const cancelBtn = document.getElementById("cancelBtn");

        // Load saved accounts
        let accounts = JSON.parse(
            localStorage.getItem("bankAccounts") || "[]"
        );

        let editingId = null;

        // SAVE ACCOUNTS
        function saveAccounts() {

            localStorage.setItem(
                "bankAccounts",
                JSON.stringify(accounts)
            );

        }

        // CREATE AND UPDATE
        accountForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const account = {

                accountNumber: document.getElementById("accountNumber").value.trim(),

                customerName: document.getElementById("customerName").value.trim(),

                email: document.getElementById("email").value.trim(),

                phone: document.getElementById("phone").value.trim(),

                accountType: document.getElementById("accountType").value,

                balance: Number(document.getElementById("balance").value)

            };

            if (!Number.isFinite(account.balance) || account.balance < 0) {
                alert("Please enter a valid balance.");
                return;
            }

            // Check duplicate account number or email
            const duplicate = accounts.some(item =>
                item.id !== editingId &&
                (
                    item.accountNumber === account.accountNumber ||
                    item.email.toLowerCase() === account.email.toLowerCase()
                )
            );

            if (duplicate) {
                alert("Account number or email already exists!");
                return;
            }

            if (editingId !== null) {

                // UPDATE
                accounts = accounts.map(item =>
                    item.id === editingId
                        ? { ...account, id: editingId }
                        : item
                );

                alert("Account updated successfully!");

            } else {

                // CREATE
                account.id = Date.now().toString();

                accounts.push(account);

                alert("Account created successfully!");

            }

            saveAccounts();
            displayAccounts();
            resetForm();

        });


        // READ AND DISPLAY ACCOUNTS
        function displayAccounts() {

            const searchValue = searchInput.value.toLowerCase();

            const filteredAccounts = accounts.filter(account =>

                account.customerName.toLowerCase().includes(searchValue) ||

                account.accountNumber.toLowerCase().includes(searchValue)

            );

            accountTable.innerHTML = "";

            if (filteredAccounts.length === 0) {

                accountTable.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty">
                            No accounts found
                        </td>
                    </tr>
                `;

            }

            filteredAccounts.forEach(account => {

                const row = document.createElement("tr");

                const values = [
                    account.accountNumber,
                    account.customerName,
                    account.email,
                    account.phone,
                    account.accountType,
                    "₹" + Number(account.balance).toLocaleString("en-IN")
                ];

                values.forEach(value => {

                    const cell = document.createElement("td");

                    cell.textContent = value;

                    row.appendChild(cell);

                });

                const actionCell = document.createElement("td");

                const editButton = document.createElement("button");

                editButton.textContent = "Edit";

                editButton.className = "edit-btn";

                editButton.addEventListener("click", () => {
                    editAccount(account.id);
                });

                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";

                deleteButton.className = "delete-btn";

                deleteButton.addEventListener("click", () => {
                    deleteAccount(account.id);
                });

                actionCell.append(editButton, deleteButton);

                row.appendChild(actionCell);

                accountTable.appendChild(row);

            });

            // Update dashboard statistics
            totalAccounts.textContent = accounts.length;

            const sum = accounts.reduce(
                (total, account) => total + Number(account.balance),
                0
            );

            totalBalance.textContent =
                "₹" + sum.toLocaleString("en-IN");

        }


        // EDIT ACCOUNT
        function editAccount(id) {

            const account = accounts.find(item => item.id === id);

            if (!account) return;

            editingId = id;

            document.getElementById("accountNumber").value = account.accountNumber;

            document.getElementById("customerName").value = account.customerName;

            document.getElementById("email").value = account.email;

            document.getElementById("phone").value = account.phone;

            document.getElementById("accountType").value = account.accountType;

            document.getElementById("balance").value = account.balance;

            formTitle.textContent = "Update Bank Account";

            submitBtn.textContent = "Update Account";

            cancelBtn.hidden = false;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        // DELETE ACCOUNT
        function deleteAccount(id) {

            const confirmDelete = confirm(
                "Are you sure you want to delete this account?"
            );

            if (!confirmDelete) return;

            accounts = accounts.filter(item => item.id !== id);

            saveAccounts();

            displayAccounts();

            if (editingId === id) {
                resetForm();
            }

            alert("Account deleted successfully!");

        }


        // RESET FORM
        function resetForm() {

            accountForm.reset();

            editingId = null;

            formTitle.textContent = "Create Bank Account";

            submitBtn.textContent = "Add Account";

            cancelBtn.hidden = true;

        }


        // CANCEL EDIT
        cancelBtn.addEventListener("click", resetForm);


        // SEARCH
        searchInput.addEventListener("input", displayAccounts);


        // INITIAL DISPLAY
        displayAccounts();

    </script>

</body>
</html>
